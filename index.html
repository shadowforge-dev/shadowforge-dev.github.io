<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>shadowforge.dev</title>
   <link rel="stylesheet" href="style.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
   <pre id="title-header" class="title-header"></pre>
   <pre id="json-container"></pre>
   <script src="script.js"></script>
   <script>
      // Initialize random ASCII art
      setRandomAsciiArt();

      // Fetch JSON data and stylize
      fetch('/data.json')
         .then(response => response.json())
         .then(data => stylizeJSON(data))
         .catch(error => {
            console.error('Error loading JSON:', error);
            showErrorBanner('Failed to load data. Please try again later.');
         });
   </script>
</body>

</html>
