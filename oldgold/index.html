<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Gold — Coming Soon</title>
    <meta name="description" content="The Cadillac edition of old.reddit.com. Dark themes, inline media, infinite scrolling, content filtering, AI summarization. Safari extension for iOS and macOS.">
    <meta name="apple-itunes-app" content="app-id=6742120455">
    <meta property="og:title" content="Old Gold — old.reddit.com, refined">
    <meta property="og:description" content="Coming soon to the App Store.">
    <meta property="og:url" content="https://shadowforge.dev/oldgold">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link rel="apple-touch-icon" href="oldgold-icon.png">
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('pixel-inet.ttf') format('truetype');
            font-display: swap;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0C0C0C;
            color: #D5D0C4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .icon {
            width: 96px;
            height: 96px;
            border-radius: 20px;
            image-rendering: pixelated;
            margin-bottom: 24px;
        }
        h1 {
            font-family: 'Pixel', monospace;
            font-size: clamp(2rem, 6vw, 3rem);
            color: #CFB53B;
            letter-spacing: 2px;
            margin-bottom: 16px;
            text-shadow: 0 2px 8px rgba(207, 181, 59, 0.35), 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        .coming-soon {
            font-family: 'Pixel', monospace;
            font-size: 1rem;
            color: #7A7560;
            letter-spacing: 3px;
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .subtitle {
            font-size: 0.85rem;
            color: #6b6555;
            margin-top: 24px;
        }
        .links {
            margin-top: 32px;
            display: flex;
            gap: 20px;
        }
        .links a {
            font-size: 0.8rem;
            color: #6b6555;
            text-decoration: none;
        }
        .links a:hover { color: #CFB53B; }
    </style>
</head>
<body>
    <img src="oldgold-icon.png" alt="Old Gold" class="icon"
         onerror="this.style.display='none'">
    <h1>Old Gold</h1>
    <p class="coming-soon">COMING SOON</p>
    <p class="subtitle">Safari Extension for old.reddit.com</p>
    <nav class="links">
        <a href="/oldgold/privacy">Privacy</a>
        <a href="/">ShadowForge LLC</a>
    </nav>
</body>
</html>
